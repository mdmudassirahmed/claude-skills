trigger:
  - main

pool:
  vmImage: ubuntu-24.04

variables:
  - group: orders-keyvault-secrets
  - name: buildConfiguration
    value: Release

jobs:
  - job: Build
    timeoutInMinutes: 30
    steps:
      - checkout: self
        fetchDepth: 1
      - task: Cache@2
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          path: $(npm_config_cache)
      - script: npm ci
      - script: |
          set -euo pipefail
          npm test
        displayName: Unit tests
      - task: AzureCLI@2
        inputs:
          azureSubscription: orders-wif-connection
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: az deployment group what-if -g rg-orders -f main.bicep
      - script: ./deploy.sh
        env:
          DB_PASSWORD: $(DbPassword)
      - script: echo "##vso[task.setvariable variable=apiToken;issecret=true]$(RawApiToken)"
        displayName: Mark token as secret
